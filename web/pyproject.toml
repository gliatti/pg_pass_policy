[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgpp-web"
version = "1.0.0"
description = "Web back-office for the pg_pass_policy PostgreSQL extension (FastAPI + HTMX)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PostgreSQL" }
dependencies = [
    "fastapi>=0.118",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
pgpp-web-hash = "app.hashpw:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/**/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
