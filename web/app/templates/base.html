<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · pg_pass_policy</title>
<meta name="htmx-config" content='{{ htmx_config|tojson }}'>
<link rel="stylesheet" href="{{ static_url('app.css') }}">
<script src="{{ static_url('htmx.min.js') }}" nonce="{{ csp_nonce }}" defer></script>
<script src="{{ static_url('app.js') }}" nonce="{{ csp_nonce }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}' hx-history="false">
<header class="topbar">
  <a class="brand" href="{{ path_for('dashboard') }}">pg_pass_policy</a>
  <nav>
    <a href="{{ path_for('dashboard') }}"{% if route_path in ('', '/') %} class="active"{% endif %}>Dashboard</a>
    <a href="{{ path_for('roles') }}"{% if route_path.startswith('/roles') %} class="active"{% endif %}>Roles</a>
    <a href="{{ path_for('profiles') }}"{% if route_path.startswith('/profiles') %} class="active"{% endif %}>Profiles</a>
    <a href="{{ path_for('audit') }}"{% if route_path.startswith('/audit') %} class="active"{% endif %}>Audit</a>
    <a href="{{ path_for('pairs') }}"{% if route_path.startswith('/pairs') %} class="active"{% endif %}>Rotation pairs</a>
    <a href="{{ path_for('maintenance') }}"{% if route_path.startswith('/maintenance') %} class="active"{% endif %}>Maintenance</a>
  </nav>
  <span class="whoami">{% if user %}signed in as <strong>{{ user }}</strong>{% endif %}</span>
</header>
<main>
<div id="alerts" aria-live="polite"></div>
{% block content %}{% endblock %}
</main>
</body>
</html>
