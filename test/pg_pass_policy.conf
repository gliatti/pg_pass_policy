# Configuration de l'instance temporaire de pg_regress (--temp-config).
# Les tests shell (test/shell/common.sh) repartent de ce fichier et surchargent
# certaines valeurs (base, intervalle du worker, réseau).
shared_preload_libraries = 'pg_pass_policy'
pg_pass_policy.database = 'contrib_regression'
# Worker en sommeil pendant pg_regress : seuls les appels explicites à
# run_maintenance() agissent, ce qui rend les sorties déterministes.
# Le worker lui-même est testé par test/shell/expiry.sh et lockout.sh.
pg_pass_policy.worker_interval = 0
password_encryption = 'scram-sha-256'
